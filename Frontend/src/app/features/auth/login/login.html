<div class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-md">

        <div class="mb-8 text-center">
            <div class="mb-4 flex justify-center">
                <div class="flex h-16 w-16 items-center justify-center rounded-xl bg-primary">
                    <i class="pi pi-map-marker text-3xl text-white"></i>
                </div>
            </div>

            <h1 class="text-3xl font-bold">Welcome to MySavaari</h1>

            <p class="mt-2 text-surface-500">
                Sign in to continue your journey
            </p>
        </div>

        <div class="surface-card rounded-xl p-8 shadow-sm">

            <form (ngSubmit)="login()">

                <div class="mb-5">
                    <label
                        for="username"
                        class="mb-2 block font-medium">
                        Username / Email
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        pInputText
                        [(ngModel)]="username"
                        placeholder="Enter your username or email"
                        class="w-full"
                        required />
                </div>

                <div class="mb-5">
                    <label
                        for="password"
                        class="mb-2 block font-medium">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        pInputText
                        [(ngModel)]="password"
                        placeholder="Enter your password"
                        class="w-full"
                        required />
                </div>

                <div class="mb-6 flex justify-end">
                    <a
                        href="#"
                        class="text-primary font-medium">
                        Forgot password?
                    </a>
                </div>

                <button
                    pButton
                    type="submit"
                    label="Sign In"
                    icon="pi pi-sign-in"
                    class="w-full">
                </button>

            </form>

            <div class="my-6 flex items-center gap-3">
                <div class="h-px flex-1 bg-surface-200"></div>

                <span class="text-sm text-surface-500">
                    OR
                </span>

                <div class="h-px flex-1 bg-surface-200"></div>
            </div>

            <div class="text-center">
                <span class="text-surface-600">
                    Don't have an account?
                </span>

                <a
                    routerLink="/auth/register"
                    class="ml-1 font-medium text-primary">
                    Create account
                </a>
            </div>

        </div>

    </div>
</div>

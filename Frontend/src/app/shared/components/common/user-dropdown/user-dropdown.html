<div class="relative">
    <!-- User button -->
    <button (click)="toggle()" type="button"
        class="flex items-center gap-3 rounded-lg p-1.5 transition hover:bg-gray-100 dark:hover:bg-gray-800">
        @if (user(); as currentUser) {
        @if (currentUser.profile_picture) {
        <img [src]="currentUser.profile_picture" [alt]="currentUser.first_name || 'User'"
            class="h-9 w-9 rounded-full object-cover" />
        } @else {
        <div
            class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-500 text-sm font-semibold text-white">
            {{ currentUser.first_name?.charAt(0) }}{{ currentUser.last_name?.charAt(0) }}
        </div>
        }
        <div class="hidden text-left sm:block">
            <p class="text-sm font-medium text-gray-800 dark:text-white">
                {{ currentUser.first_name }} {{ currentUser.last_name }}
            </p>
            <span
                class="mt-0.5 inline-flex rounded-full bg-brand-50 px-2 py-0.5 text-[10px] font-medium text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
                {{ getRoleLabel(currentUser.role) }}
            </span>
        </div>
        }
        <svg class="hidden h-4 w-4 text-gray-500 transition-transform sm:block" [class.rotate-180]="isOpen" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
        </svg>
    </button>
    <!-- Dropdown -->
    @if (isOpen) {
    <div
        class="absolute right-0 z-50 mt-3 w-64 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-theme-lg dark:border-gray-800 dark:bg-gray-900">
        @if (user(); as currentUser) {
        <!-- User information -->
        <div class="border-b border-gray-100 px-4 py-4 dark:border-gray-800">
            <p class="text-sm font-semibold text-gray-800 dark:text-white">{{ currentUser.first_name }} {{
                currentUser.last_name }}</p>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">{{ currentUser.email }}</p>
        </div>
        }
        <!-- Menu -->
        <div class="p-2">
            <a routerLink="/profile" (click)="close()"
                class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-gray-700 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800">
                <span>Profile</span>
            </a>
            <a routerLink="/settings" (click)="close()"
                class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-gray-700 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800">
                <span>Settings</span>
            </a>
            <div class="my-1 border-t border-gray-100 dark:border-gray-800"></div>
            <button type="button" (click)="logout()"
                class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-red-600 transition hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-500/10">
                <span>Logout</span>
            </button>
        </div>
    </div>
    }
</div>

<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between px-1 py-2">
  
    <!-- Page Title -->
    <div class="mb-2 sm:mb-0">
      <h1 class="text-lg sm:text-xl font-semibold text-gray-900 dark:text-white truncate max-w-full">
        {{ pageTitle }}
      </h1>
    </div>
    <!-- Breadcrumb Navigation -->
    <nav 
      class="flex overflow-x-auto scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-gray-600 scrollbar-track-transparent"
      aria-label="Breadcrumb"
    >
      <ol class="flex flex-wrap items-center space-x-1 md:space-x-2 rtl:space-x-reverse text-xs sm:text-sm">
        
        @for (item of items; track $index) {
          <li class="inline-flex items-center flex-shrink-0">
  
            @if ($index > 0) {
              <div class="flex items-center flex-shrink-0">
                <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                </svg>
              </div>
            }
            @if (item.active) {
              <span class="font-medium text-blue-600 dark:text-blue-500 truncate max-w-[6rem] sm:max-w-[10rem]">
                {{ item.label }}
              </span>
            } @else if (item.link) {
              <a 
                [routerLink]="item.link" [queryParams]="item.queryParams"
                class="inline-flex items-center font-medium text-gray-700 hover:text-blue-600 dark:text-gray-400 dark:hover:text-white truncate max-w-[6rem] sm:max-w-[10rem]"
              >
                @if ($index === 0) {
                  <svg class="w-3 h-3 me-2.5 flex-shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
                  </svg>
                }
                {{ item.label }}
              </a>
            } @else {
              <span class="inline-flex items-center font-medium text-gray-500 dark:text-gray-500 truncate max-w-[6rem] sm:max-w-[10rem]">
                @if ($index === 0) {
                  <svg class="w-3 h-3 me-2.5 flex-shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
                  </svg>
                }
                {{ item.label }}
              </span>
            }
          </li>
        }
  
      </ol>
    </nav>
  </div>

<div class="min-h-screen bg-gray-50 dark:bg-gray-950">
  <ras-header />
  <ras-sidebar />
  <main class="min-w-0 transition-[margin] duration-300 ease-in-out"
    [class.ml-[280px]]="(sidebarService.isExpanded$ | async) || (sidebarService.isHovered$ | async)"
    [class.ml-20]="!(sidebarService.isExpanded$ | async) && !(sidebarService.isHovered$ | async)">
    <div class="min-h-[calc(100vh-4rem)] p-4 md:p-6">
      <router-outlet />
    </div>
  </main>
  <p-scrolltop target="window" [threshold]="300" icon="pi pi-arrow-up" [buttonProps]="{   severity: 'danger',   raised: true,   rounded: true}"/>
  <ras-footer class="block transition-[margin] duration-300 ease-in-out"
    [class.ml-[280px]]="(sidebarService.isExpanded$ | async) || (sidebarService.isHovered$ | async)"
    [class.ml-20]="!(sidebarService.isExpanded$ | async) && !(sidebarService.isHovered$ | async)"/>

  <!-- @if (lockScreenService.isLocked()) {
    <ras-lock-screen />
  } -->
</div>

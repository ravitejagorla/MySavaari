<div class="min-h-screen bg-gray-50 dark:bg-gray-950">
  <ras-header />
  <div class="flex">
    <ras-sidebar />
    <main class="pt-16 transition-all duration-300 ease-in-out"
    [class.ml-[280px]]="
      (sidebarService.isExpanded$ | async)
    "
    [class.ml-20]="
      !(sidebarService.isExpanded$ | async)
    ">
      <div class="min-h-[calc(100vh-64px)] p-4 md:p-6">
        <router-outlet />
      </div>
    </main>
    <p-scrolltop target="window" [threshold]="300" icon="pi pi-arrow-up"
      [buttonProps]="{ severity: 'danger', raised: true, rounded: true}">
    </p-scrolltop>
  </div>
  <ras-footer />
</div>
\

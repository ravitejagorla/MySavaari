<header class="sticky top-0 z-50 h-16 border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-950">
  <div class="flex h-full items-center justify-between px-4 lg:px-6">
    <!-- Left -->
    <div class="flex items-center gap-4">
      <!-- Sidebar Toggle -->
      <button type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white lg:h-11 lg:w-11">
        <i class="pi pi-bars text-lg"></i>
      </button>

      <!-- Logo -->
      <button type="button" class="flex items-center gap-2" (click)="router.navigate(['/'])">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-500 text-white">
          <i class="pi pi-car text-lg"></i>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-lg font-semibold leading-none text-gray-900 dark:text-white">{{ appConfig.title() }}</h1>
          <p class="mt-1 text-[10px] font-medium uppercase tracking-wider text-gray-400 dark:text-gray-500">Smart Metro
          </p>
        </div>
      </button>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-2">
      <full-screen-button></full-screen-button>
      <!-- Theme -->
      <app-theme-toggle-button />
      <!-- <app-theme-toggle-button /> -->
      <!-- User Menu -->
      <div class="relative">
        <button type="button" (click)="toggleUserMenu()" class="flex items-center gap-2 rounded-lg p-1.5
                 transition-colors
                 hover:bg-gray-100
                 dark:hover:bg-gray-800">
          <!-- Avatar -->
          <div class="flex h-9 w-9 items-center justify-center
                   rounded-full bg-brand-100
                   text-sm font-semibold text-brand-600
                   dark:bg-brand-500/10 dark:text-brand-400">
            RT
          </div>

          <!-- User info -->
          <div class="hidden text-left md:block">
            <p class="text-sm font-medium text-gray-800
                     dark:text-white">
              Ravi Teja
            </p>

            <p class="text-xs text-gray-500
                     dark:text-gray-400">
              Administrator
            </p>
          </div>

          <i class="pi pi-chevron-down hidden text-xs text-gray-400 md:block"></i>

        </button>


        <!-- Dropdown -->
        @if (isUserMenuOpen) {

        <div class="absolute right-0 top-12 w-56 overflow-hidden
                   rounded-xl border border-gray-200
                   bg-white shadow-lg
                   dark:border-gray-800 dark:bg-gray-900">

          <!-- User header -->
          <div class="border-b border-gray-100 px-4 py-3
                     dark:border-gray-800">
            <p class="text-sm font-semibold text-gray-900
                       dark:text-white">
              Ravi Teja
            </p>

            <p class="mt-0.5 text-xs text-gray-500
                       dark:text-gray-400">
              Administrator
            </p>
          </div>


          <!-- Menu -->
          <div class="p-1.5">

            <button type="button" class="flex w-full items-center gap-3 rounded-lg
                       px-3 py-2.5 text-sm
                       text-gray-600 transition-colors
                       hover:bg-gray-100 hover:text-gray-900
                       dark:text-gray-300
                       dark:hover:bg-gray-800 dark:hover:text-white">
              <i class="pi pi-user"></i>
              <span>Profile</span>
            </button>

            <button type="button" class="flex w-full items-center gap-3 rounded-lg
                       px-3 py-2.5 text-sm
                       text-gray-600 transition-colors
                       hover:bg-gray-100 hover:text-gray-900
                       dark:text-gray-300
                       dark:hover:bg-gray-800 dark:hover:text-white">
              <i class="pi pi-cog"></i>
              <span>Settings</span>
            </button>

            <div class="my-1.5 border-t border-gray-100
                       dark:border-gray-800"></div>

            <button type="button" class="flex w-full items-center gap-3 rounded-lg
                       px-3 py-2.5 text-sm
                       text-red-500 transition-colors
                       hover:bg-red-50
                       dark:hover:bg-red-500/10" (click)="logout()">
              <i class="pi pi-sign-out"></i>
              <span>Logout</span>
            </button>

          </div>

        </div>

        }

      </div>

    </div>

  </div>
</header>
